name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: header
          config_timezone: America/Mexico_City
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_details: bytes-size
          # plugin_habits disabled: GitHub's public events API currently returns
          # payload.commits: null, which crashes lowlighter/metrics' habits plugin
          # unconditionally (see lowlighter/metrics#1834, #1807, #1769 upstream).
          # Re-enable once that's fixed upstream.
          plugin_habits: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: no
